<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #faf9f6;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 4px;
      color: #2d6a4f;
    }
    .subtitle {
      font-size: 12px;
      color: #78716c;
      margin: 0 0 12px;
    }
    p { margin: 0 0 12px; color: #5c6b5c; line-height: 1.4; font-size: 13px; }
    .privacy-note {
      font-size: 11px;
      color: #78716c;
      background: #f0f4ef;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .privacy-note strong { color: #2d6a4f; }
    .step {
      font-size: 13px;
      color: #44403c;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f5f3ef;
      border: 1px solid #e7e5e4;
      line-height: 1.4;
    }
    .step strong { color: #2d6a4f; }
    button {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #2d6a4f;
      color: white;
      margin-bottom: 8px;
    }
    .btn-primary:hover { background: #1b4332; }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      color: #5c6b5c;
      border: 1px solid #d8e2dc;
      font-size: 13px;
    }
    .btn-secondary:hover { background: #f0f4ef; }
    .status { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; line-height: 1.4; }
    .status.success { background: #d1fae5; color: #065f46; }
    .status.error { background: #fee2e2; color: #991b1b; }
    .status.warn { background: #fef3c7; color: #92400e; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>MindFlow Research</h1>
  <p class="subtitle">Cookie Pattern Donation</p>

  <div class="privacy-note">
    <strong>Privacy:</strong> Only cookie domain/name metadata is shared. Values, contents, and personal data are <strong>never</strong> sent.
  </div>

  <div id="step-install" class="step">
    <strong>Step 1:</strong> Complete the questionnaire on the research site, then return here to donate.
  </div>
  <div id="step-donate" class="step hidden">
    <strong>Ready!</strong> Click below to donate your anonymized cookie patterns.
  </div>

  <button id="donate-btn" class="btn-primary">Donate cookie patterns</button>
  <button id="open-site-btn" class="btn-secondary">Open research site</button>

  <div id="status" class="status hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
