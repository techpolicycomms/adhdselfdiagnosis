<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #faf9f6;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 8px;
      color: #2d6a4f;
    }
    p { margin: 0 0 12px; color: #5c6b5c; line-height: 1.4; }
    .step { font-size: 12px; color: #78716c; margin-bottom: 12px; }
    button {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #2d6a4f;
      color: white;
      margin-bottom: 8px;
    }
    .btn-primary:hover { background: #1b4332; }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      color: #5c6b5c;
      border: 1px solid #d8e2dc;
    }
    .btn-secondary:hover { background: #f0f4ef; }
    .status { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; }
    .status.success { background: #d1fae5; color: #065f46; }
    .status.error { background: #fee2e2; color: #991b1b; }
    .status.warn { background: #fef3c7; color: #92400e; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>MindFlow Research</h1>
  <p>Donate anonymized cookie patterns to help ADHD research. Only domain/name metadata is shared—values are never sent.</p>

  <div id="step-install" class="step">
    <strong>Step 1:</strong> Complete the questionnaire at mindflow-research.local
  </div>
  <div id="step-donate" class="step hidden">
    <strong>Step 2:</strong> Click below to donate your cookie patterns
  </div>

  <button id="donate-btn" class="btn-primary">Donate cookie patterns</button>
  <button id="open-site-btn" class="btn-secondary">Open research site</button>

  <div id="status" class="status hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
